[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rulesmith"
version = "0.1.0"
description = "Autonomous detection-engineering agent: threat intel in, tested Sigma rules out. Built on NVIDIA Nemotron via Nebius Token Factory."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Arekkusul"}]
dependencies = [
    "openai>=1.60,<4",
    "pydantic>=2.6",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "tavily-python>=0.5",
    "pysigma>=0.11",
    "pysigma-backend-sqlite>=2.0.0",
    "pysigma-backend-splunk>=1.1",
    "pysigma-backend-elasticsearch>=1.1",
    "pysigma-backend-kusto>=0.4",
    "pysigma-pipeline-sysmon>=1.0",
    "pysigma-pipeline-windows>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
rulesmith = "rulesmith.cli:main"

[tool.setuptools.packages.find]
include = ["rulesmith*"]

[tool.setuptools.package-data]
rulesmith = ["server/static/*", "prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
